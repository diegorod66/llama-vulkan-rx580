name: Build llama.cpp Vulkan

on:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake git \
            libvulkan-dev vulkan-tools \
            glslang-tools spirv-headers lld

      - name: Clone llama.cpp
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          echo "Commit: $(git rev-parse HEAD)"
          echo "Date: $(git log -1 --format=%cd)"

      - name: Install glslc from shaderc source
        run: bash scripts/install-glslc.sh

      - name: Apply cooperative matrix patch for Polaris
        run: |
          python3 scripts/patch-cooperative-matrix.py llama.cpp
          grep -A 10 "function(test_shader_extension_support" llama.cpp/ggml/src/ggml-vulkan/CMakeLists.txt | head -15

      - name: Configure CMake
        run: |
          mkdir -p llama.cpp/build
          cd llama.cpp/build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_CUDA=OFF \
            -DGGML_METAL=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_LINKER_TYPE=LLD \
            -G "Unix Makefiles"

      - name: Build
        run: |
          cd llama.cpp/build
          make -j$(nproc) 2>&1 | tail -20

      - name: Package binaries
        run: |
          mkdir -p binaries-v2.0.0
          cp llama.cpp/build/bin/llama-server binaries-v2.0.0/
          cp -a llama.cpp/build/bin/*.so* binaries-v2.0.0/ 2>/dev/null || true
          ls -la llama.cpp/build/bin/ || true
          cd llama.cpp
          echo "Commit: $(git rev-parse HEAD)" > ../binaries-v2.0.0/BUILD_INFO.txt
          echo "Date: $(git log -1 --format=%cd)" >> ../binaries-v2.0.0/BUILD_INFO.txt
          echo "GGML Vulkan: ON" >> ../binaries-v2.0.0/BUILD_INFO.txt
          cd ..
          ls -lh binaries-v2.0.0/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-v2.0.0
          path: binaries-v2.0.0/
          retention-days: 90
