name: Build llama.cpp Vulkan

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    branches: [main, master]
    paths:
      - 'scripts/build.sh'
      - '.github/workflows/build.yml'
      - 'source/**'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake git \
            libvulkan-dev vulkan-tools \
            lld

      - name: Check Vulkan SDK
        run: |
          which glslc || echo "glslc not found"
          glslc --version
          vulkaninfo --summary 2>&1 | head -5 || echo "vulkaninfo ok (no GPU in CI)"

      - name: Clone llama.cpp
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          echo "Commit: $(git rev-parse HEAD)"
          echo "Date: $(git log -1 --format=%cd)"

      - name: Apply cooperative matrix patch for Polaris
        run: |
          PATCH_FILE="llama.cpp/ggml/src/ggml-vulkan/CMakeLists.txt"
          python3 -c "
import re, sys
with open('$PATCH_FILE', 'r') as f:
    content = f.read()
if 'cooperative_matrix.*forced OFF' in content:
    print('Patch already applied, skipping.')
    sys.exit(0)
content = re.sub(
    r'(function\(test_shader_extension_support\s+EXTENSION_NAME\s+TEST_SHADER_FILE\s+RESULT_VARIABLE\))',
    r'\1\n    if(EXTENSION_NAME MATCHES \"cooperative_matrix\")\n        set(\${RESULT_VARIABLE} OFF PARENT_SCOPE)\n        message(STATUS \"\${EXTENSION_NAME} forced OFF\")\n        return()\n    endif()',
    content
)
with open('$PATCH_FILE', 'w') as f:
    f.write(content)
print('Patch applied successfully.')
"
          grep -A 10 "function(test_shader_extension_support" "$PATCH_FILE" | head -15

      - name: Configure CMake
        run: |
          mkdir -p llama.cpp/build
          cd llama.cpp/build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_CUDA=OFF \
            -DGGML_METAL=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_LINKER_TYPE=LLD \
            -G "Unix Makefiles"

      - name: Build
        run: |
          cd llama.cpp/build
          make -j$(nproc) 2>&1 | tail -20

      - name: Package binaries
        run: |
          mkdir -p binaries-v2.0.0
          cp llama.cpp/build/bin/llama-server binaries-v2.0.0/
          cp llama.cpp/build/bin/*.so* binaries-v2.0.0/ 2>/dev/null || true
          # Also copy from bin/ if they exist
          ls -la llama.cpp/build/bin/ || true
          # Generate version info
          cd llama.cpp
          echo "Commit: $(git rev-parse HEAD)" > ../binaries-v2.0.0/BUILD_INFO.txt
          echo "Date: $(git log -1 --format=%cd)" >> ../binaries-v2.0.0/BUILD_INFO.txt
          echo "GGML Vulkan: ON" >> ../binaries-v2.0.0/BUILD_INFO.txt
          cd ..
          ls -lh binaries-v2.0.0/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-v2.0.0
          path: binaries-v2.0.0/
          retention-days: 90
